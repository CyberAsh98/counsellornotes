<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counsellor Notes</title>
<style>
/* ============================================================
   VARIABLES & RESET
   ============================================================ */
:root {
  --bg: #FAF8F5;
  --sidebar-bg: #F0EDE8;
  --accent: #7C9E87;
  --accent-hover: #5E8A72;
  --accent-light: #EBF1ED;
  --text: #2C2C2C;
  --text-muted: #8C887F;
  --text-light: #B5B0A8;
  --card: #FFFFFF;
  --border: #E8E4DE;
  --shadow: 0 1px 6px rgba(44,36,28,0.07);
  --shadow-md: 0 4px 16px rgba(44,36,28,0.10);
  --private-bg: #FDF6EF;
  --private-accent: #9B7E5A;
  --private-border: #E8D8C4;
  --danger: #C9504A;
  --warning: #D4954A;
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-width: 232px;
  --topbar-height: 56px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: var(--font); cursor: pointer; }

/* ============================================================
   LOCK SCREEN
   ============================================================ */
#lock-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#lock-screen.active { display: flex; }
.lock-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.lock-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow-md);
  padding: 44px 40px 36px;
  width: 340px;
  text-align: center;
}
.lock-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 28px;
}
.lock-logo-icon {
  width: 42px;
  height: 42px;
  background: var(--accent);
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lock-logo h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.lock-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 8px;
}
.pin-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid var(--border);
  transition: all 0.15s;
}
.pin-dot.filled { background: var(--accent); border-color: var(--accent); }
.pin-dot.error { background: var(--danger); border-color: var(--danger); }
.lock-error {
  font-size: 12px;
  color: var(--danger);
  min-height: 20px;
  margin-bottom: 12px;
}
.pin-numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.pin-key {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 10px;
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  transition: all 0.1s;
}
.pin-key:hover { background: var(--accent-light); border-color: var(--accent); }
.pin-key:active { transform: scale(0.94); }
.pin-key.action { background: var(--accent); color: #fff; border-color: var(--accent); }
.pin-key.action:hover { background: var(--accent-hover); }
.lock-hint { font-size: 11.5px; color: var(--text-light); }

/* ============================================================
   APP SHELL
   ============================================================ */
#app-shell {
  display: none;
  height: 100vh;
  overflow: hidden;
}
#app-shell.active { display: flex; }

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo-icon {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sidebar-logo span { font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px; }
.sidebar-nav { padding: 10px 8px; flex: 1; }
.nav-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 10px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text-muted);
  transition: all 0.15s;
  user-select: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(0,0,0,0.04); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent-hover); font-weight: 500; }
.nav-item svg { flex-shrink: 0; }
.sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
.sidebar-bottom { padding: 10px 8px; border-top: 1px solid var(--border); }

/* MAIN */
#main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar {
  height: var(--topbar-height);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  flex-shrink: 0;
}
.breadcrumb { flex: 1; font-size: 13px; color: var(--text-muted); }
.breadcrumb b { color: var(--text); font-weight: 500; }
.breadcrumb .sep { margin: 0 6px; color: var(--text-light); }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
#page-content { flex: 1; overflow-y: auto; padding: 28px 32px; }
#page-content > * { animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  font-family: var(--font);
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: rgba(0,0,0,0.05); color: var(--text); }
.btn-danger-soft { background: #FEF2F2; color: var(--danger); border: 1px solid #FDD; }
.btn-danger-soft:hover { background: #FEE2E2; }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: var(--radius-sm); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11.5px; }

/* ============================================================
   INPUTS & FORMS
   ============================================================ */
input, textarea, select {
  font-family: var(--font);
  font-size: 13.5px;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,158,135,0.12);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title { font-size: 13.5px; font-weight: 600; }
.card-body { padding: 20px; }
.card-body-sm { padding: 14px 18px; }

/* ============================================================
   TAGS
   ============================================================ */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--accent-light);
  color: var(--accent-hover);
  border: 1px solid rgba(124,158,135,0.25);
}
.tag-muted { background: var(--sidebar-bg); color: var(--text-muted); border-color: var(--border); }
.tag-private { background: #FDF0E4; color: var(--private-accent); border-color: #EACBA8; }
.tag-warning { background: #FEF3E8; color: var(--warning); border-color: #FDDDB5; }
.tag-sm { padding: 2px 8px; font-size: 11px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 7px; top: 10px; bottom: 10px;
  width: 2px;
  background: var(--border);
}
.timeline-item { position: relative; margin-bottom: 20px; }
.tl-dot {
  position: absolute;
  left: -25px; top: 16px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--card);
  box-shadow: 0 0 0 2px var(--accent);
}
.tl-dot.unresolved { background: var(--warning); box-shadow: 0 0 0 2px var(--warning); }
.tl-dot.uncertain { background: var(--text-light); box-shadow: 0 0 0 2px var(--text-light); }
.tl-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 18px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}
.tl-card:hover { box-shadow: var(--shadow-md); }
.tl-date { font-size: 11px; color: var(--text-light); font-weight: 500; margin-bottom: 4px; }
.tl-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.tl-body { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

/* ============================================================
   PATIENT CARDS (list view)
   ============================================================ */
.patient-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.patient-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.patient-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.p-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600; color: #fff;
  margin-bottom: 12px;
}
.p-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.p-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }

/* ============================================================
   PATIENT DASHBOARD HEADER + TABS
   ============================================================ */
.patient-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 26px 0;
  margin-bottom: 22px;
}
.ph-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.ph-avatar {
  width: 54px; height: 54px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; color: #fff;
  flex-shrink: 0;
}
.ph-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.ph-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
.ph-actions { margin-left: auto; display: flex; gap: 8px; }
.patient-tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--border); }
.patient-tabs::-webkit-scrollbar { display: none; }
.ptab {
  padding: 10px 15px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.ptab:hover { color: var(--text); }
.ptab.active { color: var(--accent-hover); border-bottom-color: var(--accent); font-weight: 500; }
.ptab.private-tab { color: var(--private-accent); opacity: 0.75; }
.ptab.private-tab.active { opacity: 1; border-bottom-color: var(--private-accent); }

/* ============================================================
   SECTION LAYOUTS
   ============================================================ */
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sec-title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.sec-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.field { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.field-value { font-size: 13.5px; color: var(--text); line-height: 1.55; }
.field-empty { font-size: 13px; color: var(--text-light); font-style: italic; }

/* ============================================================
   SESSION CARDS
   ============================================================ */
.session-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.session-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.sc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.sc-num { font-size: 10.5px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
.sc-date { font-size: 12px; color: var(--text-muted); }
.sc-concern { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.sc-tone { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

/* ============================================================
   PRIVATE / INSIGHTS ZONE
   ============================================================ */
.private-zone {
  background: var(--private-bg);
  border: 1px solid var(--private-border);
  border-radius: var(--radius);
  padding: 20px;
}
.private-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #FDF0E4;
  color: var(--private-accent);
  border: 1px solid var(--private-border);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.private-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--private-border);
}
.private-title { font-size: 15px; font-weight: 600; color: var(--private-accent); }
.private-zone .field-label { color: #BFA07A; }

/* ============================================================
   SNAPSHOT BARS (mental/emotional)
   ============================================================ */
.snapshot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.snap-item { text-align: center; }
.snap-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.snap-bar {
  height: 56px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  position: relative;
  overflow: hidden;
}
.snap-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--accent);
  border-radius: 4px;
  opacity: 0.85;
  transition: height 0.4s;
}
.snap-val { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

/* ============================================================
   RELATION NODES
   ============================================================ */
.relation-wrap { display: flex; flex-wrap: wrap; gap: 16px; }
.rel-node { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
.rel-avatar {
  width: 50px; height: 50px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600; color: #fff;
  border: 3px solid transparent;
}
.rel-avatar.close { border-color: var(--accent); }
.rel-avatar.conflict { border-color: var(--danger); }
.rel-name { font-size: 10.5px; color: var(--text-muted); text-align: center; max-width: 62px; }
.rel-role { font-size: 10px; color: var(--text-light); }

/* ============================================================
   HOME PAGE
   ============================================================ */
.home-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 22px; }
.recent-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}
.recent-item:hover { box-shadow: var(--shadow-md); }
.ri-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; flex-shrink: 0; }
.ri-name { font-size: 13.5px; font-weight: 500; }
.ri-sub { font-size: 11.5px; color: var(--text-muted); }
.ri-arrow { margin-left: auto; color: var(--text-light); }
.quick-action {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: var(--shadow);
}
.quick-action:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.qa-icon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--accent-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.qa-label { font-size: 13.5px; font-weight: 500; }
.qa-sub { font-size: 11.5px; color: var(--text-muted); }

/* ============================================================
   PATTERNS PAGE
   ============================================================ */
.pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.pattern-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.pattern-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent); }
.pattern-count { font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.pattern-label { font-size: 13px; font-weight: 500; }
.pattern-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* ============================================================
   SETTINGS
   ============================================================ */
.settings-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 18px;
  overflow: hidden;
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }
.sr-left {}
.sr-label { font-size: 13.5px; font-weight: 500; }
.sr-desc { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

/* ============================================================
   SEARCH OVERLAY
   ============================================================ */
#search-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44,36,28,0.28);
  z-index: 500;
  align-items: flex-start;
  justify-content: center;
  padding-top: 80px;
}
#search-overlay.active { display: flex; }
.search-modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-md);
  width: 560px;
  max-height: 460px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.search-bar input { border: none; box-shadow: none; font-size: 15px; padding: 0; }
.search-bar input:focus { box-shadow: none; }
.search-results { overflow-y: auto; padding: 10px; flex: 1; }
.sr-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.1s;
}
.sr-item:hover { background: var(--bg); }

// ── Data store (localStorage) ────────────────────────────────
function loadDB() {
  try {
    const saved = localStorage.getItem('counsellor_notes_db');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DB));
}
function saveDB() {
  try { localStorage.setItem('counsellor_notes_db', JSON.stringify(db)); } catch(e) {}
}
let db = loadDB();

// ── App state ────────────────────────────────────────────────
let state = {
  locked: true,
  page: 'home',
  patientId: null,
  sessionId: null,
  tab: 'overview',
  pinBuffer: '',
};

// ── Auto-lock timer ──────────────────────────────────────────
let lockTimer = null;
let lastActivity = Date.now();

function resetActivityTimer() {
  lastActivity = Date.now();
  if (lockTimer) clearTimeout(lockTimer);
  const mins = db.settings.autoLockMinutes || 15;
  lockTimer = setTimeout(() => lockApp(), mins * 60 * 1000);
}

document.addEventListener('mousemove', resetActivityTimer);
document.addEventListener('keydown', resetActivityTimer);
document.addEventListener('click', resetActivityTimer);

// ── Lock / Unlock ────────────────────────────────────────────
function lockApp() {
  state.locked = true;
  state.pinBuffer = '';
  document.getElementById('lock-screen').classList.add('active');
  document.getElementById('app-shell').classList.remove('active');
  updatePinDots();
  document.getElementById('lock-error').textContent = '';
  if (lockTimer) clearTimeout(lockTimer);
}

function unlockApp() {
  state.locked = false;
  document.getElementById('lock-screen').classList.remove('active');
  document.getElementById('app-shell').classList.add('active');
  resetActivityTimer();
  navigate(state.page || 'home');
}

// ── PIN logic ────────────────────────────────────────────────
function pinPress(key) {
  const err = document.getElementById('lock-error');
  if (key === 'back') {
    state.pinBuffer = state.pinBuffer.slice(0,-1);
    err.textContent = '';
  } else if (key === 'enter' || state.pinBuffer.length === 4) {
    if (key !== 'back' && key !== 'enter') {
      if (state.pinBuffer.length >= 4) return;
      state.pinBuffer += key;
    }
    if (state.pinBuffer.length === 4) checkPin();
    else if (key === 'enter') err.textContent = 'Please enter a 4-digit PIN';
  } else {
    state.pinBuffer += key;
    if (state.pinBuffer.length === 4) {
      updatePinDots();
      setTimeout(checkPin, 80);
      return;
    }
  }
  updatePinDots();
}

function checkPin() {
  if (state.pinBuffer === db.settings.pin) {
    document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('error'));
    state.pinBuffer = '';
    updatePinDots();
    unlockApp();
  } else {
    document.querySelectorAll('.pin-dot').forEach(d => { d.classList.add('error'); d.classList.remove('filled'); });
    document.getElementById('lock-error').textContent = 'Incorrect PIN. Try again.';
    state.pinBuffer = '';
    setTimeout(() => {
      document.querySelectorAll('.pin-dot').forEach(d => { d.classList.remove('error','filled'); });
      document.getElementById('lock-error').textContent = '';
    }, 900);
  }
}

function updatePinDots() {
  for (let i=0; i<4; i++) {
    const dot = document.getElementById('dot-'+i);
    if (!dot) continue;
    dot.classList.toggle('filled', i < state.pinBuffer.length);
  }
}

// Also allow keyboard PIN entry
document.addEventListener('keydown', (e) => {
  if (!state.locked) return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Backspace') pinPress('back');
  else if (e.key === 'Enter') pinPress('enter');
});

// ── Toast ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Modal helpers ────────────────────────────────────────────
function openModal(title, bodyHTML, footHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-foot').innerHTML = footHTML || '';
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
function modalOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── Search overlay ───────────────────────────────────────────
function openSearch() {
  document.getElementById('search-overlay').classList.add('active');
  setTimeout(() => document.getElementById('search-input').focus(), 50);
}
function closeSearch() {
  document.getElementById('search-overlay').classList.remove('active');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '<div class="search-empty">Start typing to search across all records</div>';
}
function searchOverlayClick(e) {
  if (e.target === document.getElementById('search-overlay')) closeSearch();
}

document.addEventListener('keydown', (e) => {
  if (!state.locked && (e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault(); openSearch();
  }
  if (e.key === 'Escape') { closeSearch(); closeModal(); }
});

// ── Navigation / Router ──────────────────────────────────────
function navigate(page, params = {}) {
  state.page = page;
  if (params.patientId !== undefined) state.patientId = params.patientId;
  if (params.sessionId !== undefined) state.sessionId = params.sessionId;
  if (params.tab !== undefined) state.tab = params.tab;
  else if (page === 'patient') state.tab = state.tab || 'overview';

  // Sidebar active state
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  renderPage();
}

// Sidebar click delegation
document.querySelectorAll('.nav-item[data-page]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

function renderPage() {
  const pc = document.getElementById('page-content');
  pc.innerHTML = '';

  switch (state.page) {
    case 'home':     renderHome(pc); break;
    case 'patients': renderPatients(pc); break;
    case 'patient':  renderPatientDashboard(pc); break;
    case 'session':  renderSessionDetail(pc); break;
    case 'patterns': renderPatterns(pc); break;
    case 'settings': renderSettings(pc); break;
    default:         renderHome(pc);
  }
}

function setBreadcrumb(html) {
  document.getElementById('breadcrumb').innerHTML = html;
}

function renderPatients(container) {

function renderFilteredPatients() {
  const q = patientSearchQuery.toLowerCase();
  const filtered = db.patients.filter(p => {
    if (!q) return true;
    const name = p.identity.fullName.toLowerCase();
    const preferred = (p.identity.preferredName||'').toLowerCase();
    const tags = (p.tags||[]).join(' ').toLowerCase();
    return name.includes(q) || preferred.includes(q) || tags.includes(q);
  });

  const grid = document.getElementById('patients-grid');
  if (!grid) return;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">👤</div>
      <div class="empty-text">${q ? 'No patients match that search' : 'No patients yet'}</div>
      <div class="empty-hint">${q ? '' : 'Add your first patient to get started'}</div>
    </div>`;
    return;
  }

  grid.innerHTML = `<div class="patient-grid">
    ${filtered.map(p => patientCardHTML(p)).join('')}
  </div>`;
}

function patientCardHTML(p) {
  const sessions = p.sessions || [];
  const lastSess = sessions.length ? sessions[sessions.length-1] : null;
  const days = p.lastSession ? daysSince(p.lastSession) : null;
  const daysLabel = days === null ? 'No sessions'
    : days === 0 ? 'Session today'
    : days === 1 ? 'Session yesterday'
    : `Last session ${days}d ago`;

  const tagsHTML = (p.tags||[]).slice(0,3).map(t =>
    `<span class="tag tag-sm">${escHtml(t)}</span>`).join('');

  return `<div class="patient-card" onclick="navigate('patient',{patientId:'${p.id}',tab:'overview'})">
    <div class="p-avatar" style="background:${p.color}">${initials(p.identity.fullName)}</div>
    <div class="p-name">${escHtml(p.identity.fullName)}</div>
    <div class="p-meta">${p.identity.age ? `Age ${p.identity.age}` : ''} · ${sessions.length} session${sessions.length !== 1 ? 's' : ''} · ${daysLabel}</div>
    <div class="tags">${tagsHTML}</div>
  </div>`;
}

// ── HTML escape ──────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

}

function switchTab(tabId) {
  state.tab = tabId;
  document.querySelectorAll('.ptab').forEach(el => {
    el.classList.toggle('active', el.onclick?.toString().includes(`'${tabId}'`) ||
      el.getAttribute('onclick')?.includes(`'${tabId}'`));
  });
  // Re-render just the tab content
  const p = db.patients.find(x => x.id === state.patientId);
  if (!p) return;
  renderTabContent(p);
}

function renderTabContent(p) {
  const tc = document.getElementById('tab-content');
  if (!tc) return;
  tc.innerHTML = '';

  switch (state.tab) {
    case 'overview':      renderOverviewTab(tc, p); break;
    case 'identity':      renderIdentityTab(tc, p); break;
    case 'family':        renderFamilyTab(tc, p); break;
    case 'academic':      renderAcademicTab(tc, p); break;
    case 'mental':        renderMentalTab(tc, p); break;
    case 'history':       renderHistoryTab(tc, p); break;
    case 'situation':     renderSituationTab(tc, p); break;
    case 'interventions': renderInterventionsTab(tc, p); break;
    case 'sessions':      renderSessionsTab(tc, p); break;
    case 'insights':      renderInsightsTab(tc, p); break;
    default:              renderOverviewTab(tc, p);
  }
}

function openEditTagsModal(pid) {
  const p = db.patients.find(x=>x.id===pid); if(!p) return;
  const allTags = db.globalTags;
  const selected = new Set(p.tags||[]);
  const tagsHTML = allTags.map(t =>
    `<span class="tag${selected.has(t)?' ':'tag-muted '}" style="cursor:pointer;margin:3px"
      onclick="toggleTagSelection(this,'${escHtml(t)}')"
      data-tag="${escHtml(t)}" data-selected="${selected.has(t)}"
    >${escHtml(t)}</span>`).join('');
  const customInput = `<div style="margin-top:12px;display:flex;gap:8px">
    <input id="new-tag-input" type="text" placeholder="Add custom tag…" style="flex:1">
    <button class="btn btn-secondary btn-sm" onclick="addCustomTag()">Add</button>
  </div>`;

  openModal('Edit Tags',
    `<div style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px">Select tags for this patient:</div>
    <div id="tag-selector">${tagsHTML}</div>
    ${customInput}`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveTags('${pid}')">Save</button>`
  );
}
function toggleTagSelection(el, tag) {
  const selected = el.dataset.selected === 'true';
  el.dataset.selected = !selected;
  if (!selected) { el.classList.remove('tag-muted'); }
  else { el.classList.add('tag-muted'); }
}
function addCustomTag() {
  const input = document.getElementById('new-tag-input');
  const val = input.value.trim().toLowerCase().replace(/\s+/,'-');
  if (!val) return;
  if (!db.globalTags.includes(val)) db.globalTags.push(val);
  const el = document.createElement('span');
  el.className = 'tag'; el.style.cursor='pointer'; el.style.margin='3px';
  el.dataset.tag = val; el.dataset.selected = 'true';
  el.textContent = val;
  el.onclick = function() { toggleTagSelection(this, val); };
  document.getElementById('tag-selector').appendChild(el);
  input.value = '';
}
function saveTags(pid) {
  const p = db.patients.find(x=>x.id===pid); if(!p) return;
  const tags = [];
  document.querySelectorAll('#tag-selector [data-tag]').forEach(el => {
    if (el.dataset.selected === 'true') tags.push(el.dataset.tag);
  });
  p.tags = tags;
  saveDB(); closeModal(); showToast('Tags saved'); navigate('patient',{patientId:pid,tab:'overview'});
}

function addCustomTagToSession() {
  const input = document.getElementById('ns-custom-tag');
  const val = input.value.trim().toLowerCase().replace(/\s+/g,'-');
  if (!val) return;
  if (!db.globalTags.includes(val)) db.globalTags.push(val);
  const el = document.createElement('span');
  el.className='tag tag-sm'; el.style.cursor='pointer'; el.style.margin='3px';
  el.dataset.tag=val; el.dataset.selected='true';
  el.textContent=val;
  el.onclick=function(){toggleTagSelection(this,val);};
  document.getElementById('ns-tags').appendChild(el);
  input.value='';
}
function saveSession(pid) {
  const p = db.patients.find(x=>x.id===pid); if(!p) return;
  const concern = document.getElementById('ns-concern').value.trim();
  if (!concern) { showToast('Please enter the presenting concern'); return; }
  const themes = [];
  document.querySelectorAll('#ns-tags [data-tag]').forEach(el => {
    if (el.dataset.selected==='true') themes.push(el.dataset.tag);
  });
  const interventionsRaw = document.getElementById('ns-interventions').value.trim();
  const interventions = interventionsRaw ? interventionsRaw.split('\n').map(s=>s.trim()).filter(Boolean) : [];
  if (!p.sessions) p.sessions = [];
  const sess = {
    id: uid(),
    number: p.sessions.length + 1,
    date: document.getElementById('ns-date').value || new Date().toISOString().slice(0,10),
    concern,
    tone: document.getElementById('ns-tone').value.trim(),
    themes,
    interventions,
    reflections: document.getElementById('ns-reflections').value.trim(),
    followUp: document.getElementById('ns-followup').value.trim()
  };
  p.sessions.push(sess);
  p.lastSession = sess.date;
  // Add new themes to global tags
  themes.forEach(t => { if (!db.globalTags.includes(t)) db.globalTags.push(t); });
  // Add new tags to patient tags
  themes.forEach(t => { if (!p.tags) p.tags=[]; if (!p.tags.includes(t)) p.tags.push(t); });
  saveDB(); closeModal(); showToast('Session saved');
  navigate('session',{patientId:pid,sessionId:sess.id});
}

// ── CROSS-CASE PATTERNS ───────────────────────────────────────
function renderPatterns(container) {
  setBreadcrumb('<b>Cross-Case Patterns</b>');

  // Build tag frequency map
  const tagMap = {};
  db.patients.forEach(p => {
    // From patient tags
    (p.tags||[]).forEach(t => { tagMap[t] = tagMap[t]||{count:0,patients:[],sessions:[]}; if(!tagMap[t].patients.includes(p.identity.fullName)) tagMap[t].patients.push(p.identity.fullName); tagMap[t].count++; });
    // From sessions
    (p.sessions||[]).forEach(s => {
      (s.themes||[]).forEach(t => { tagMap[t] = tagMap[t]||{count:0,patients:[],sessions:[]}; tagMap[t].sessions.push({patient:p.identity.fullName,sessionNum:s.number,date:s.date,concern:s.concern}); if(!tagMap[t].patients.includes(p.identity.fullName)) tagMap[t].patients.push(p.identity.fullName); });
    });
    // From case history
    (p.caseHistory||[]).forEach(h => {
      (h.tags||[]).forEach(t => { tagMap[t] = tagMap[t]||{count:0,patients:[],sessions:[]}; if(!tagMap[t].patients.includes(p.identity.fullName)) tagMap[t].patients.push(p.identity.fullName); });
    });
  });

  const sorted = Object.entries(tagMap).sort((a,b) => b[1].patients.length - a[1].patients.length || b[1].sessions.length - a[1].sessions.length);

  const cardsHTML = sorted.map(([tag,data]) => `
    <div class="pattern-card" onclick="showPatternDetail('${escHtml(tag)}')">
      <div class="pattern-count">${data.patients.length}</div>
      <div class="pattern-label">${escHtml(tag)}</div>
      <div class="pattern-sub">${data.patients.length} patient${data.patients.length!==1?'s':''} · ${data.sessions.length} session mention${data.sessions.length!==1?'s':''}</div>
    </div>`).join('');

  container.innerHTML = `

// ── SEARCH ────────────────────────────────────────────────────
function doSearch(query) {
  const q = query.trim().toLowerCase();
  const results = document.getElementById('search-results');
  if (!q) { results.innerHTML='<div class="search-empty">Start typing to search across all records</div>'; return; }

  const hits = [];
  db.patients.forEach(p => {
    const name = p.identity.fullName.toLowerCase();
    const preferred = (p.identity.preferredName||'').toLowerCase();
    // Patient name
    if (name.includes(q)||preferred.includes(q)) {
      hits.push({ type:'Patient', main:p.identity.fullName, sub:`Age ${p.identity.age||'?'} · ${(p.sessions||[]).length} sessions`, action:()=>{ closeSearch(); navigate('patient',{patientId:p.id,tab:'overview'}); } });
    }
    // Sessions
    (p.sessions||[]).forEach(s => {
      if ((s.concern||'').toLowerCase().includes(q) || (s.reflections||'').toLowerCase().includes(q) || (s.themes||[]).join(' ').toLowerCase().includes(q)) {
        hits.push({ type:'Session', main:`${p.identity.preferredName||p.identity.fullName} — Session ${s.number}`, sub:escHtml(s.concern), action:()=>{ closeSearch(); navigate('session',{patientId:p.id,sessionId:s.id}); } });
      }
    });
    // Case history
    (p.caseHistory||[]).forEach(h => {
      if ((h.event||'').toLowerCase().includes(q)||(h.patientNarrative||'').toLowerCase().includes(q)) {
        hits.push({ type:'History', main:escHtml(h.event), sub:`${p.identity.preferredName||p.identity.fullName} · ${h.period||h.date}`, action:()=>{ closeSearch(); navigate('patient',{patientId:p.id,tab:'history'}); } });
      }
    });
    // Tags
    (p.tags||[]).forEach(t => {
      if (t.toLowerCase().includes(q)) {
        hits.push({ type:'Tag', main:`#${t}`, sub:`Tagged on ${p.identity.fullName}`, action:()=>{ closeSearch(); navigate('patient',{patientId:p.id,tab:'overview'}); } });
      }
    });
  });

  if (!hits.length) { results.innerHTML='<div class="search-empty">No results found</div>'; return; }

  results.innerHTML = hits.slice(0,20).map((h,i) => `
    <div class="sr-item" id="sr-${i}">
      <span class="sr-type">${h.type}</span>
      <div><div class="sr-main">${h.main}</div><div class="sr-sub">${h.sub}</div></div>
    </div>`).join('');

  hits.slice(0,20).forEach((h,i) => {
    document.getElementById('sr-'+i)?.addEventListener('click', h.action);
  });
}

// Patch saveSession to capture snapshot
const _origSaveSess=saveSession;
saveSession=function(pid){
  // intercept before actual save by wrapping the push
  const snapKeys=['mood','anxiety','energy','sleep','affect'];
  const snapEls=snapKeys.map(k=>document.getElementById('sn-'+k));
  const hasSnap=snapEls.every(el=>el!==null);
  _origSaveSess(pid);
  // attach snapshot to newly created session
  if(hasSnap){
    const p=db.patients.find(x=>x.id===pid);if(!p||!p.sessions.length)return;
    const s=p.sessions[p.sessions.length-1];
    s.snapshot={};

    if(!p.mentalEmotional)p.mentalEmotional={snapshot:{},observations:{}};
    p.mentalEmotional.snapshot={...s.snapshot};
    saveDB();
  }
};

// SVG line chart
function buildTrendChart(sessions,width=480,height=120){
  const keys=['mood','anxiety','energy','sleep','affect'];
  const colors=['#7C9E87','#D4954A','#6B8FAB','#A07B8A','#9B7E5A'];
  const pts=sessions.filter(s=>s.snapshot).map(s=>({num:s.number,snap:s.snapshot}));
  if(pts.length<2)return'<div class="field-empty" style="padding:12px 0">Need at least 2 sessions with snapshot data to show trends.</div>';
  const pad={l:28,r:12,t:10,b:24};
  const W=width-pad.l-pad.r,H=height-pad.t-pad.b;
  const xScale=i=>(i/(pts.length-1))*W;
  const yScale=v=>H-(((v-1)/9)*H);
  let paths=keys.map((k,ki)=>{
    const d=pts.map((p,i)=>`${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(p.snap[k]||5).toFixed(1)}`).join(' ');
    return`<path d="${d}" fill="none" stroke="${colors[ki]}" stroke-width="1.8" stroke-linejoin="round" opacity=".85"/>`;
  }).join('');
  let dots=pts.map((p,i)=>keys.map((k,ki)=>
    `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(p.snap[k]||5).toFixed(1)}" r="3" fill="${colors[ki]}" opacity=".9"/>`
  ).join('')).join('');
  // x labels
  const xlabels=pts.map((p,i)=>`<text x="${xScale(i).toFixed(1)}" y="${H+18}" text-anchor="middle" font-size="9" fill="#B5B0A8">S${p.num}</text>`).join('');
  // y grid
  const ygrid=[2,4,6,8,10].map(v=>`<line x1="0" y1="${yScale(v).toFixed(1)}" x2="${W}" y2="${yScale(v).toFixed(1)}" stroke="#E8E4DE" stroke-width="1"/>
    <text x="-4" y="${(yScale(v)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#B5B0A8">${v}</text>`).join('');
  const legend=keys.map((k,ki)=>`<div class="trend-legend-item"><div class="trend-legend-dot" style="background:${colors[ki]}"></div>${k[0].toUpperCase()+k.slice(1)}</div>`).join('');
  return`<div class="trend-wrap">
    <svg class="trend-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
      <g transform="translate(${pad.l},${pad.t})">${ygrid}${paths}${dots}${xlabels}</g>
    </svg></div>
    <div class="trend-legend">${legend}</div>`;
}

function renderGoalsTab(tc,p){
  const goals=p.goals||[];
  const active=goals.filter(g=>g.status==='active');
  const rest=goals.filter(g=>g.status!=='active');

  tc.innerHTML=`<div class="sec-header">
    <div><div class="sec-title">Goals</div>
    <div class="sec-subtitle">Patient-defined. No targets imposed — progress noted, not scored.</div></div>
    <button class="btn btn-primary btn-sm" onclick="openAddGoalModal('${p.id}')">+ Add Goal</button>
  </div>
  ${!goals.length?`<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">No goals recorded yet</div><div class="empty-hint">Goals should come from the patient, not be assigned</div></div>`:''}
  ${active.map(g=>goalCardHTML(g,p.id)).join('')}
  ${rest.length?`<div style="font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px">Achieved / Paused</div>${rest.map(g=>goalCardHTML(g,p.id)).join('')}`:''}`;
}

function goalCardHTML(g,pid){
  const statusDot=`<span class="goal-status-${g.status}"></span>`;
  const progressHTML=(g.progress||[]).slice(-3).reverse().map(pr=>
    `<div class="goal-progress-item"><span style="flex-shrink:0;color:var(--text-light)">${fmtDateShort(pr.date)}</span>${escHtml(pr.note)}</div>`
  ).join('');
  return`<div class="goal-card ${g.status}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div>
        <div style="font-size:14px;font-weight:600;margin-bottom:2px">${statusDot}${escHtml(g.goal)}</div>
        <div class="text-sm text-muted">Added ${fmtDate(g.addedDate)}${g.progress?.length?' · '+(g.progress.length)+' progress note'+(g.progress.length!==1?'s':''):''}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn btn-ghost btn-xs" onclick="openAddProgressModal('${pid}','${g.id}')">+ Progress</button>
        <select class="btn btn-ghost btn-xs" style="padding:3px 6px;font-size:11.5px"
          onchange="changeGoalStatus('${pid}','${g.id}',this.value);this.value='${g.status}'">
          <option value="active"${g.status==='active'?' selected':''}>Active</option>
          <option value="achieved"${g.status==='achieved'?' selected':''}>Achieved</option>
          <option value="paused"${g.status==='paused'?' selected':''}>Paused</option>
        </select>
      </div>
    </div>
    ${progressHTML?`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">${progressHTML}</div>`:''}
  </div>`;
}

function openAddGoalModal(pid){
  openModal('Add Patient Goal',
    `<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Goals should be expressed in the patient's own words where possible.</div>
    <div class="form-group"><label class="form-label">Goal *</label><textarea id="ag-goal" placeholder="What does the patient want to work toward or change?"></textarea></div>
    <div class="form-group"><label class="form-label">Context / how it came up</label><textarea id="ag-context" placeholder="Optional: how this goal was identified…"></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveGoal('${pid}')">Add Goal</button>`
  );
}
function saveGoal(pid){
  const p=db.patients.find(x=>x.id===pid);if(!p)return;
  const goal=document.getElementById('ag-goal').value.trim();
  if(!goal){showToast('Please describe the goal');return;}
  if(!p.goals)p.goals=[];
  p.goals.push({id:uid(),goal,context:document.getElementById('ag-context').value.trim(),
    status:'active',addedDate:new Date().toISOString().slice(0,10),progress:[]});
  saveDB();closeModal();showToast('Goal added');navigate('patient',{patientId:pid,tab:'goals'});
}

function openAddProgressModal(pid,gid){
  openModal('Add Progress Note',
    `<div class="form-group"><label class="form-label">Date</label><input id="gp-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
     <div class="form-group"><label class="form-label">Progress note *</label><textarea id="gp-note" placeholder="What movement, insight, or change was noted?"></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="saveProgress('${pid}','${gid}')">Save</button>`
  );
}
function saveProgress(pid,gid){
  const p=db.patients.find(x=>x.id===pid);if(!p)return;
  const g=p.goals?.find(x=>x.id===gid);if(!g)return;
  const note=document.getElementById('gp-note').value.trim();
  if(!note){showToast('Please enter a note');return;}
  if(!g.progress)g.progress=[];
  g.progress.push({date:document.getElementById('gp-date').value,note});
  saveDB();closeModal();showToast('Progress noted');navigate('patient',{patientId:pid,tab:'goals'});
}
function changeGoalStatus(pid,gid,status){
  const p=db.patients.find(x=>x.id===pid);if(!p)return;
  const g=p.goals?.find(x=>x.id===gid);if(g){g.status=status;saveDB();showToast('Status updated');navigate('patient',{patientId:pid,tab:'goals'});}
}

// ══ MVP 5: CASE SUMMARY EXPORT ═══════════════════════════════

function exportCaseSummary(pid){
  const p=db.patients.find(x=>x.id===pid);if(!p)return;
  const id=p.identity||{};
  const cs=p.currentSituation||{};
  const ac=p.academicCareer||{};
  const me=p.mentalEmotional||{};
  const sessions=p.sessions||[];
  const lastSess=sessions.length?sessions[sessions.length-1]:null;
  const allThemes=[...new Set(sessions.flatMap(s=>s.themes||[]))];

  // Interventions that appeared more than once
  const intCounts={};
  sessions.forEach(s=>(s.interventions||[]).forEach(i=>{intCounts[i]=(intCounts[i]||0)+1;}));
  const topInts=Object.entries(intCounts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>k);

  // Goals summary
  const goals=(p.goals||[]);
  const activeGoals=goals.filter(g=>g.status==='active');
  const achieved=goals.filter(g=>g.status==='achieved');

  const row=(label,val)=>val?`<tr><td style="padding:6px 12px 6px 0;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;vertical-align:top;width:160px">${label}</td><td style="padding:6px 0;font-size:13.5px;color:#2C2C2C;line-height:1.6">${val}</td></tr>`:'';

  const snap=me.snapshot||{};
  const snapStr=Object.entries(snap).map(([k,v])=>`${k[0].toUpperCase()+k.slice(1)}: ${v}/10`).join(' · ');

  const doc=`<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Case Summary — ${id.fullName}</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:40px auto;color:#2C2C2C;font-size:14px;line-height:1.6}
h1{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.sub{font-size:13px;color:#888;margin-bottom:28px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#7C9E87;margin:24px 0 10px;border-bottom:1px solid #E8E4DE;padding-bottom:6px}
table{width:100%;border-collapse:collapse}
.tag{display:inline-block;background:#EBF1ED;color:#5E8A72;border:1px solid rgba(124,158,135,.25);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:500;margin:2px}
.private-notice{background:#FDF6EF;border:1px solid #E8D8C4;border-radius:8px;padding:10px 14px;font-size:12px;color:#9B7E5A;margin-top:28px}
.session-row{padding:8px 0;border-bottom:1px solid #F0EDE8;font-size:13px}
.session-row:last-child{border-bottom:none}
.goal-item{padding:6px 0;font-size:13px;border-bottom:1px solid #F0EDE8}
.goal-item:last-child{border-bottom:none}
@media print{body{margin:20px}h2{color:#5E8A72}}
</style></head><body>
<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px">
  <div>
    <h1>${id.fullName}${id.preferredName&&id.preferredName!==id.fullName?' ("'+id.preferredName+'")':''}</h1>
    <div class="sub">${id.age?'Age '+id.age+' · ':''}${sessions.length} sessions · Last seen ${lastSess?fmtDate(lastSess.date):'—'}</div>
  </div>
  <div style="font-size:11px;color:#B5B0A8;text-align:right">Generated ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}<br>CONFIDENTIAL — Clinical Record</div>
</div>

<h2>Identity & Context</h2>
<table>${row('Age / Gender',[(id.age?'Age '+id.age:''),id.gender].filter(Boolean).join(' · '))}
${row('Life stage',ac.lifeStage)}
${row('Career',ac.career)}
${row('Emergency contact',id.emergencyContact)}</table>

<h2>Current Situation</h2>
<table>${row('Active pressures',cs.pressures)}
${row('Coping mechanisms',cs.copingMechanisms)}
${row('What has helped',cs.helped)}
${row('Support map',cs.supportMap)}</table>

${allThemes.length?`<h2>Recurring Themes</h2><div>${allThemes.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}

${snapStr?`<h2>Emotional Snapshot</h2><div style="font-size:13px;color:#555">${snapStr}</div>`:''}

${goals.length?`<h2>Goals (${activeGoals.length} active${achieved.length?', '+achieved.length+' achieved':''})</h2>
${goals.map(g=>`<div class="goal-item"><span style="color:${g.status==='achieved'?'#3A7BD5':g.status==='paused'?'#B5B0A8':'#7C9E87'};font-weight:600;margin-right:6px">${g.status==='achieved'?'✓':g.status==='paused'?'~':'●'}</span>${g.goal}</div>`).join('')}`:''}

${topInts.length?`<h2>Interventions Used</h2><div>${topInts.map(i=>`<span class="tag">${i}</span>`).join('')}</div>`:''}

<h2>Session Summary</h2>
${sessions.slice(-6).reverse().map(s=>`<div class="session-row"><strong>Session ${s.number}</strong> · ${fmtDate(s.date)} · ${s.concern}</div>`).join('')}
${sessions.length>6?`<div style="font-size:12px;color:#B5B0A8;margin-top:4px">Showing last 6 of ${sessions.length} sessions</div>`:''}

<div class="private-notice">🔒 Therapist Insights and private formulation are not included in this export. Access them within the secure workspace only.</div>
</body></html>`;

  const w=window.open('','_blank');
  w.document.write(doc);
  w.document.close();
  setTimeout(()=>w.print(),400);
}

  s.format    = g('ns-format');
  s.arriveState = g('ns-arrive');
  s.leaveState  = g('ns-leave');
  s.effective   = g('ns-effective');
  s.alliance    = g('ns-alliance');
  s.homework    = g('ns-homework');
  s.riskStatus  = g('ns-risk') || 'No concerns';
  // Sync risk flag: if any session is Flagged, set patient flag
  if(s.riskStatus==='Flagged') p.riskFlag=true;
  saveDB();
};

// Patch session detail to show new fields
const _origSessDetail = renderSessionDetail;
renderSessionDetail = function(container){
  _origSessDetail(container);
  const p=db.patients.find(x=>x.id===state.patientId);
  const s=p?.sessions?.find(x=>x.id===state.sessionId); if(!s) return;

  // Insert arrival/departure + extra fields after the grid
  const grid = container.querySelector('.grid-2'); if(!grid) return;

  const extras=[];
  if(s.arriveState||s.leaveState){
    extras.push(`<div class="card"><div class="card-header"><span class="card-title">Session Arc</span></div>
      <div class="card-body" style="display:flex;gap:20px;align-items:center">
        ${s.arriveState?`<div><div class="field-label" style="margin-bottom:5px">Arrived</div><span class="state-chip state-${s.arriveState}">${s.arriveState}</span></div>`:''}
        ${s.arriveState&&s.leaveState?`<div style="color:var(--text-light);font-size:18px">→</div>`:''}
        ${s.leaveState?`<div><div class="field-label" style="margin-bottom:5px">Left</div><span class="state-chip state-${s.leaveState}">${s.leaveState}</span></div>`:''}
      </div></div>`);
  }
  if(s.effective){
    extras.push(`<div class="card"><div class="card-header"><span class="card-title">What Felt Effective</span></div>
      <div class="card-body"><div class="field-value">${escHtml(s.effective)}</div></div></div>`);
  }
  if(s.alliance){
    extras.push(`<div class="card"><div class="card-header"><span class="card-title">Therapeutic Alliance</span></div>
      <div class="card-body"><div class="field-value">${escHtml(s.alliance)}</div></div></div>`);
  }
  if(s.homework){
    extras.push(`<div class="card"><div class="card-header"><span class="card-title">Homework / Task Set</span></div>
      <div class="card-body"><div class="field-value">${escHtml(s.homework)}</div></div></div>`);
  }
  if(extras.length){
    const wrap=document.createElement('div');
    wrap.style.cssText='margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px';
    wrap.innerHTML=extras.join('');
    grid.after(wrap);
  }
  // Risk badge in header area
  if(s.riskStatus&&s.riskStatus!=='No concerns'){
    const hdr=container.querySelector('div[style*="font-size:19px"]')?.parentElement;
    if(hdr){
      const badge=document.createElement('span');
      badge.className=s.riskStatus==='Flagged'?'risk-flag-badge':'tag tag-warning';
      badge.textContent=s.riskStatus==='Flagged'?'⚠️ Flagged':'⚑ Monitoring';
      badge.style.marginTop='6px';
      hdr.appendChild(badge);
    }
  }
};

// Add risk/format/arc to session card
const _origSessTabs = renderSessionsTab;
renderSessionsTab = function(tc,p){
  _origSessTabs(tc,p);
  // Re-annotate cards with arc chips
  p.sessions.slice().reverse().forEach((s,i)=>{
    const card=tc.querySelectorAll('.session-card')[i];
    if(!card) return;
    const arcHTML=[];
    if(s.arriveState&&s.leaveState)
      arcHTML.push(`<span class="state-chip state-${s.arriveState}" style="font-size:10.5px">${s.arriveState}</span> → <span class="state-chip state-${s.leaveState}" style="font-size:10.5px">${s.leaveState}</span>`);
    if(s.riskStatus==='Flagged') arcHTML.push(`<span class="risk-flag-badge">⚠️</span>`);
    if(s.riskStatus==='Monitoring') arcHTML.push(`<span class="tag tag-warning tag-sm">⚑ monitoring</span>`);
    if(arcHTML.length){const d=document.createElement('div');d.style.marginTop='8px';d.innerHTML=arcHTML.join(' ');card.appendChild(d);}
  });
};


// ══ SECTION 3: ENHANCED PATTERNS DASHBOARD ══════════════════

// Override renderPatterns entirely
renderPatterns = function(container){
  setBreadcrumb('<b>Cross-Case Patterns</b>');

  // ── Build data ──────────────────────────────────────────
  const tagMap={};
  const intMap={};   // intervention effectiveness
  const arcMap={};   // arrival->departure by tag

  db.patients.forEach(p=>{
    (p.tags||[]).forEach(t=>{
      tagMap[t]=tagMap[t]||{count:0,patients:[],sessions:[],firstSeen:null};
      if(!tagMap[t].patients.includes(p.id)) tagMap[t].patients.push(p.id);
    });
    (p.sessions||[]).forEach(s=>{
      (s.themes||[]).forEach(t=>{
        tagMap[t]=tagMap[t]||{count:0,patients:[],sessions:[],firstSeen:null};
        if(!tagMap[t].patients.includes(p.id)) tagMap[t].patients.push(p.id);
        tagMap[t].sessions.push({pid:p.id,sid:s.id,date:s.date,num:s.number,concern:s.concern});
        if(!tagMap[t].firstSeen||s.date<tagMap[t].firstSeen) tagMap[t].firstSeen=s.date;
        // arc
        if(s.arriveState&&s.leaveState){
          const key=t;
          arcMap[key]=arcMap[key]||{};
          const arc=`${s.arriveState}→${s.leaveState}`;
          arcMap[key][arc]=(arcMap[key][arc]||0)+1;
        }
      });
      // effective interventions
      if(s.effective){
        const themes=s.themes||[];
        themes.forEach(t=>{
          intMap[t]=intMap[t]||[];
          intMap[t].push(s.effective);
        });
      }
    });
    (p.caseHistory||[]).forEach(h=>{
      (h.tags||[]).forEach(t=>{
        tagMap[t]=tagMap[t]||{count:0,patients:[],sessions:[],firstSeen:null};
        if(!tagMap[t].patients.includes(p.id)) tagMap[t].patients.push(p.id);
      });
    });
  });

  const sorted=Object.entries(tagMap).sort((a,b)=>b[1].patients.length-a[1].patients.length);
  const topTags=sorted.slice(0,10).map(([t])=>t);

  // ── Co-occurrence matrix ────────────────────────────────
  const cooc={};
  topTags.forEach(a=>topTags.forEach(b=>{ cooc[a+':'+b]=0; }));
  db.patients.forEach(p=>{
    const ptags=new Set([
      ...(p.tags||[]),
      ...(p.sessions||[]).flatMap(s=>s.themes||[])
    ]);
    topTags.forEach(a=>topTags.forEach(b=>{
      if(a!==b&&ptags.has(a)&&ptags.has(b)) cooc[a+':'+b]++;
    }));
  });
  const maxCooc=Math.max(1,...Object.values(cooc));

  const matrixHTML=`<div style="overflow-x:auto">
    <table style="border-collapse:collapse;font-size:10px">
      <tr><td></td>${topTags.map(t=>`<td style="padding:2px 3px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;color:var(--text-muted);white-space:nowrap;height:60px">${t}</td>`).join('')}</tr>
      ${topTags.map(a=>`<tr>
        <td style="padding:3px 6px 3px 0;font-size:9.5px;color:var(--text-muted);white-space:nowrap;text-align:right">${a}</td>
        ${topTags.map(b=>{
          if(a===b) return`<td style="width:22px;height:22px;background:var(--border);border-radius:3px"></td>`;
          const v=cooc[a+':'+b];
          const op=v?(0.15+(v/maxCooc)*0.85).toFixed(2):0;
          const bg=v?`rgba(124,158,135,${op})`:'var(--bg)';
          return`<td style="width:22px;height:22px"><div class="cooc-cell" style="width:22px;height:22px;background:${bg};color:${v>0?'#fff':'transparent'}"
            title="${a} + ${b}: ${v} patient${v!==1?'s':''}"
            onclick="showPatternDetail('${escHtml(a)}')">${v||''}</div></td>`;
        }).join('')}
      </tr>`).join('')}
    </table>
  </div>`;

  // ── Active caseload strip ───────────────────────────────
  const caseloadHTML=db.patients.map(p=>{
    const days=daysSince(p.lastSession);
    const risk=p.riskFlag?'<span class="risk-flag-badge" style="font-size:10px;padding:1px 6px">⚠️</span>':'';
    const activeGoals=(p.goals||[]).filter(g=>g.status==='active').length;
    const gapBar=days!==null?Math.min(days/42,1):0;
    const barColor=days===null?'var(--text-light)':days<14?'var(--accent)':days<28?'var(--warning)':'var(--danger)';
    return`<div class="caseload-row" onclick="navigate('patient',{patientId:'${p.id}',tab:'overview'})">
      <div style="width:32px;height:32px;border-radius:50%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0">${initials(p.identity.fullName)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px">${escHtml(p.identity.preferredName||p.identity.fullName)} ${risk}</div>
        <div style="font-size:11px;color:var(--text-muted)">${(p.sessions||[]).length} sessions · ${activeGoals} active goal${activeGoals!==1?'s':''}</div>
        <div class="mini-bar" style="width:${(gapBar*100).toFixed(0)}%;background:${barColor};max-width:120px"></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;font-weight:600;color:${barColor}">${days===null?'No sessions':days===0?'Today':days+'d ago'}</div>
        <div style="font-size:10px;color:var(--text-light)">${(p.intake?.modality)||''}</div>
      </div>
    </div>`;
  }).join('');

  // ── Intervention effectiveness ──────────────────────────
  const intEntries=Object.entries(intMap).filter(([,v])=>v.length);
  const intHTML=intEntries.length?intEntries.slice(0,6).map(([tag,notes])=>`
    <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <span class="tag tag-sm" style="margin-bottom:6px;display:inline-block">${escHtml(tag)}</span>
      ${notes.slice(0,2).map(n=>`<div class="text-sm text-muted" style="padding-left:8px;border-left:2px solid var(--accent-light);margin-bottom:4px">${escHtml(n.slice(0,100))}${n.length>100?'…':''}</div>`).join('')}
    </div>`).join('')
    :'<div class="field-empty">Add "what felt effective" to sessions to build this library.</div>';

  // ── Tag frequency bars ──────────────────────────────────
  const maxPts=Math.max(1,...sorted.map(([,d])=>d.patients.length));
  const freqHTML=sorted.slice(0,12).map(([tag,data])=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer" onclick="showPatternDetail('${escHtml(tag)}')">
      <div style="width:110px;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(tag)}</div>
      <div style="flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--border)">
        <div style="height:100%;width:${((data.patients.length/maxPts)*100).toFixed(0)}%;background:var(--accent);border-radius:4px"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);width:24px;text-align:right">${data.patients.length}</div>
    </div>`).join('');

  container.innerHTML=`
    <div class="page-header">
      <div class="sec-title">Cross-Case Patterns</div>
      <div class="sec-subtitle">Themes, co-occurrences, and what's working — across your caseload</div>
    </div>

    <div class="dash-grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-header"><span class="card-title">Theme Frequency</span><span class="text-sm text-muted">by patient count</span></div>
          <div class="card-body">${freqHTML||'<div class="field-empty">No tags yet</div>'}</div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Intervention Effectiveness</span><span class="text-sm text-muted">from "what felt effective"</span></div>
          <div class="card-body" style="max-height:260px;overflow-y:auto">${intHTML}</div>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-header"><span class="card-title">Co-occurrence Matrix</span><span class="text-sm text-muted">top 10 themes</span></div>
          <div class="card-body">${topTags.length>=2?matrixHTML:'<div class="field-empty">Need 2+ tagged themes to show co-occurrence.</div>'}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Active Caseload</span><span class="text-sm text-muted">last seen + risk + goals</span></div>
      <div class="card-body">${caseloadHTML||'<div class="field-empty">No patients yet</div>'}</div>
    </div>`;
};

</script>
